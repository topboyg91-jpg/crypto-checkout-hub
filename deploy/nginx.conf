# Static Gramory build behind a Tor hidden service.
# Point torrc at this server:  HiddenServicePort 80 127.0.0.1:8080
server {
  listen 127.0.0.1:8080;
  server_name _;
  root /var/www/gramory;        # contents of dist/client
  index index.html;

  # Tor is slow: compress aggressively and cache hashed assets forever.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # No third-party origins, no referrers leaking the .onion address.
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Prerendered HTML first, then directory index, then the SPA fallback so
  # routes added after the build (new products) still resolve.
  location / {
    try_files $uri $uri/index.html $uri.html /index.html;
  }
}
